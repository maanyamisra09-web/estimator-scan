name: Estimator Forum Scanner

on:
  schedule:
    - cron: '0 9 * * 2'
    - cron: '0 9 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run estimator scan
        run: python estimator_scanner.py

      - name: Commit results
        run: |
          git config user.name "estimator-scanner[bot]"
          git config user.email "scanner@contravault.ai"
          git add output/
          git diff --staged --quiet || git commit -m "scan: estimator forum scan $(date -u +%Y-%m-%d)"
          git push
